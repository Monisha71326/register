<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="./bootstrap-5.0.2-dist/css/bootstrap.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
  
  </style>
  
</head>
<body style="background-image: url('im.jpeg');background-size: cover;background-position: center;background-repeat: no-repeat;min-height:100vh;"class="bg-white">

  <div class=" container h-50 d-flex justify-content-center align-items-center mt-5">
    <div class="card   shadow-lg border-5 border-dark rounded-4 w-100 max-width: 1000px;">
      <div class="row g-0 h-100">

        <!-- Left column: Image -->
		
        <div class="col-md-6 d-flex align-items-center justify-content-center min-vh-50 ">
		<div class="position-relative w-100 h-100">
		<img src="assets/img/img.jpeg" class="w-100 h-100 rounded-start-4">
        </div>
		<div class="position-absolute top-50 start-25 translate-middle-y text-white text-center text-nowrap">
		<h2 class="fw-bold">Create your account</h2>
		<p class="mb-0">share your artwork and Get Projects!</p>
		</div>
		</div>
		
		
	

        <!-- Right column: Form -->
		
        <div class="col-md-6 bg-white rounded-end-4 d-flex">
          <div class="w-75 mx-auto my-4">
            <h2 class="fw-bold display-5 mb-4 text-center">Sign Up</h2>
            <form>
              <div class="mb-3">
                <label class="fw-bold form-label fs-4">Full Name</label>
                <input type="text" class="form-control form-control-lg" placeholder="Name...">
              </div>
              <div class="mb-3">
                <label class="fw-bold form-label fs-4">Email</label>
                <input type="email" class="form-control form-control-lg" placeholder="Email address...">
              </div>
              <div class="mb-3">
                <label class="fw-bold form-label fs-4">Username</label>
                <input type="text" class="form-control form-control-lg" placeholder="Username...">
              </div>
              <div class="mb-3">
                <label class="fw-bold form-label fs-4">Password</label>
                <input type="password" class="form-control form-control-lg" placeholder="********">
              </div>
              <div class="mb-3">
                <label class="fw-bold form-label fs-4">Confirm Password</label>
                <input type="password" class="form-control form-control-lg" placeholder="********">
              </div>
              <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="terms">
                <label class="form-check-label" for="terms">
                  I agree to the Terms of Use
                </label>
              </div>
              <button class="btn btn-lg btn-primary w-100">Sign Up</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
